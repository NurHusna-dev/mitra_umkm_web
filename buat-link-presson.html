<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Buat Link Bayar Press-On | Admin EM Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Bodoni+Moda:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/icons/tabler/tabler-icons-em.css">
<style>
  :root{--bg:#0f0d0c;--card:#171310;--line:#3a302a;--line2:#4a3d33;--text:#efe4d8;--muted:#a8998b;--tan:#d9b393;--btn:#d4a98a;--btn-text:#2a1a10;--wa:#7fd17a;--err:#f09595}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.55;padding:32px 16px}
  .card{background:var(--card);border:.5px solid var(--line);border-radius:18px;padding:24px;max-width:560px;margin:0 auto}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:26px;margin:0 0 4px}
  .tan{color:var(--tan)} .mut{color:var(--muted)}
  label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase}
  input,select,textarea{width:100%;background:var(--bg);border:.5px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--btn)}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .out{background:var(--bg);border:.5px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12px;word-break:break-all;white-space:pre-wrap;min-height:44px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  button{border:none;border-radius:999px;padding:11px;font:inherit;font-weight:500;cursor:pointer;background:var(--btn);color:var(--btn-text)}
  button.ghost{background:transparent;color:var(--text);border:.5px solid #5a4a3e}
  button.green{background:var(--wa);color:#10260e;grid-column:1/-1}
  .err{color:var(--err);font-size:12px;margin:8px 0 0}
  @media (max-width:480px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <h1>Link bayar <i class="tan">Press-On</i></h1>
  <p class="mut" style="margin:0">Khusus admin. Isi setelah harga disepakati di WhatsApp, lalu kirim link ke pelanggan.</p>

  <div class="g">
    <div><label for="kode">Kode pesanan</label><input id="kode"></div>
    <div><label for="ukuran">Ukuran</label>
      <select id="ukuran"><option value="">-</option><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div>
  </div>
  <label for="desain">Desain</label><input id="desain" placeholder="Custom cat eye, almond, medium">
  <div class="g">
    <div><label for="harga">Harga press-on (Rp)</label><input id="harga" type="number" min="1000" step="1000" placeholder="150000"></div>
    <div><label for="ongkir">Ongkir (Rp, 0 jika ambil)</label><input id="ongkir" type="number" min="0" step="1000" value="0"></div>
  </div>
  <div class="g">
    <div><label for="estimasi">Estimasi selesai</label><input id="estimasi" placeholder="3-5 hari kerja"></div>
    <div><label for="hp">No. WA pelanggan (opsional)</label><input id="hp" type="tel" placeholder="0812xxxxxxx"></div>
  </div>

  <label>Link pembayaran</label>
  <div class="out" id="link"></div>
  <label>Pesan untuk pelanggan</label>
  <div class="out" id="msg"></div>
  <p class="err" id="err"></p>
  <div class="btns">
    <button type="button" id="cpLink"><i class="ti ti-link"></i> Salin link</button>
    <button type="button" class="ghost" id="cpMsg"><i class="ti ti-copy"></i> Salin pesan</button>
    <button type="button" class="green" id="sendWA"><i class="ti ti-brand-whatsapp"></i> Kirim ke WA pelanggan</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const d = new Date();
$('kode').value = 'PO-' + String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');

// booking.html harus berada di folder yang sama dengan file ini
const base = location.href.replace(/[^/]*([?#].*)?$/, '') + 'booking.html';

function build() {
  const harga = parseInt($('harga').value, 10) || 0;
  const ongkir = parseInt($('ongkir').value, 10) || 0;
  const kode = $('kode').value.trim();
  $('err').textContent = '';
  if (!kode || harga < 1000) {
    $('link').textContent = '';
    $('msg').textContent = '';
    return null;
  }
  const p = new URLSearchParams({ po: kode, harga });
  if (ongkir) p.set('ongkir', ongkir);
  if ($('desain').value.trim()) p.set('desain', $('desain').value.trim());
  if ($('ukuran').value) p.set('ukuran', $('ukuran').value);
  if ($('estimasi').value.trim()) p.set('estimasi', $('estimasi').value.trim());
  const link = base + '?' + p.toString();
  const msg = `Halo kak, terima kasih sudah kirim referensinya.\n\n` +
    `Pesanan ${kode}\n` +
    ($('desain').value.trim() ? `• Desain: ${$('desain').value.trim()}\n` : '') +
    ($('ukuran').value ? `• Ukuran: ${$('ukuran').value}\n` : '') +
    `• Harga: ${rp(harga)}\n` + (ongkir ? `• Ongkir: ${rp(ongkir)}\n` : '') +
    `• Total: ${rp(harga + ongkir)}\n` +
    ($('estimasi').value.trim() ? `• Estimasi selesai: ${$('estimasi').value.trim()}\n` : '') +
    `\nSilakan bayar DP atau lunas lewat link ini ya:\n${link}`;
  $('link').textContent = link;
  $('msg').textContent = msg;
  return { link, msg };
}
document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', build));
build();

function need() {
  const r = build();
  if (!r) $('err').textContent = 'Isi kode pesanan dan harga (minimal Rp1.000) dulu.';
  return r;
}
const copy = (txt, btn) => navigator.clipboard.writeText(txt).then(() => {
  const old = btn.innerHTML; btn.innerHTML = '<i class="ti ti-check"></i> Tersalin'; setTimeout(() => btn.innerHTML = old, 1500);
});
$('cpLink').onclick = () => { const r = need(); if (r) copy(r.link, $('cpLink')); };
$('cpMsg').onclick = () => { const r = need(); if (r) copy(r.msg, $('cpMsg')); };
$('sendWA').onclick = () => {
  const r = need(); if (!r) return;
  let hp = $('hp').value.replace(/\D/g, '');
  if (hp.startsWith('0')) hp = '62' + hp.slice(1);
  window.open('https://wa.me/' + hp + '?text=' + encodeURIComponent(r.msg), '_blank');
};
</script>
</body>
</html>
